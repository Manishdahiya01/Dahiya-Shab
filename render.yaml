services:
  - type: web
    name: dahiya-movie-store-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELETHON_SESSION
        sync: false
      - key: MONGODB_DATABASE
        value: dahiya_movie_store
      - key: LOG_LEVEL
        value: INFO

